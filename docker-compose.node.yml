version: "3.9"

services:
  # The API instance for this node
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      PORT: ${PORT:-8080}
      WORKER_ID: ${NODE_NAME:-node-unknown}
    ports:
      - "${PORT:-8080}:${PORT:-8080}"

  # The AI Worker instance for this node
  worker:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    environment:
      REDIS_URL: ${REDIS_URL}
      WORKER_ID: ${NODE_NAME:-node-unknown}
      API_URL: ${API_URL}

  # Optional: Data services (usually only run on Node Alpha)
  crdb:
    image: cockroachdb/cockroach:latest-v23.1
    profiles: ["data"]
    command: start-single-node --insecure --advertise-addr=crdb --http-addr=0.0.0.0
    ports:
      - "26257:26257"
      - "26258:26258"
    volumes:
      - crdb_data:/cockroach/cockroach-data

  redis:
    image: redis:7-alpine
    profiles: ["data"]
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    profiles: ["data"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  crdb_data:
  minio_data:
