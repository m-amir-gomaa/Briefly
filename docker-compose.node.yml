version: "3.9"

services:
  api-node:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/m-amir-gomaa/briefly-api:latest
    container_name: api-node
    environment:
      DATABASE_URL: "postgres://root@${PRIMARY_NODE_IP:-100.124.255.38}:26257/defaultdb?sslmode=disable"
      REDIS_URL: "redis://${PRIMARY_NODE_IP:-100.124.255.38}:6379"
      S3_ENDPOINT: "${PRIMARY_NODE_IP:-100.124.255.38}:9000"
      S3_ACCESS_KEY: briefly_admin
      S3_SECRET_KEY: briefly_storage_secret
      BRIEFLY_DEMO_GEMINI_API_KEY: "${BRIEFLY_DEMO_GEMINI_API_KEY}"
      PORT: "8081"
      WORKER_ID: "node-beta"
    ports:
      - "8081:8081"
    restart: unless-stopped

  worker-node:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    image: ghcr.io/m-amir-gomaa/briefly-worker:latest
    container_name: worker-node
    environment:
      REDIS_URL: "redis://${PRIMARY_NODE_IP:-100.124.255.38}:6379"
      WORKER_ID: "node-beta"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY}"
      API_URL: "http://${PRIMARY_NODE_IP:-100.124.255.38}:8080"
      S3_ENDPOINT: "${PRIMARY_NODE_IP:-100.124.255.38}:9000"
      S3_ACCESS_KEY: "briefly_admin"
      S3_SECRET_KEY: "briefly_storage_secret"
    restart: unless-stopped
