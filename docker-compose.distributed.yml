version: "3.9"

services:
  # ────────────────────────────────────────────────────────────────────────────
  # Node Alpha (Primary Node / Seed)
  # ────────────────────────────────────────────────────────────────────────────
  crdb-alpha:
    image: cockroachdb/cockroach:latest-v23.1
    container_name: crdb-alpha
    command: start-single-node --insecure --advertise-addr=crdb-alpha --http-addr=0.0.0.0
    ports:
      - "26257:26257"
      - "26258:26258"
    volumes:
      - crdb_alpha_data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "/cockroach/cockroach", "node", "status", "--insecure", "--host=crdb-alpha:26257"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-alpha:
    image: redis:7-alpine
    container_name: redis-alpha
    command: redis-server --save 60 1
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-alpha:
    image: minio/minio
    container_name: minio-alpha
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: briefly_admin
      MINIO_ROOT_PASSWORD: briefly_storage_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - minio_alpha_data:/data

  api-alpha:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/m-amir-gomaa/briefly-api:latest
    container_name: api-alpha
    environment:
      DATABASE_URL: "postgres://root@${PRIMARY_NODE_IP:-crdb-alpha}:26257/defaultdb?sslmode=disable"
      REDIS_URL: "redis://${PRIMARY_NODE_IP:-redis-alpha}:6379"
      S3_ENDPOINT: "${PRIMARY_NODE_IP:-minio-alpha}:9000"
      S3_ACCESS_KEY: briefly_admin
      S3_SECRET_KEY: briefly_storage_secret
      BRIEFLY_DEMO_GEMINI_API_KEY: "${BRIEFLY_DEMO_GEMINI_API_KEY}"
      PORT: "8080"
      WORKER_ID: "node-alpha"
    ports:
      - "8082:8080"
    depends_on:
      crdb-alpha:
        condition: service_healthy
      redis-alpha:
        condition: service_started
      minio-alpha:
        condition: service_started

  worker-alpha:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    image: ghcr.io/m-amir-gomaa/briefly-worker:latest
    container_name: worker-alpha
    environment:
      REDIS_URL: "redis://redis-alpha:6379"
      WORKER_ID: "node-alpha"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY}"
      API_URL: "http://api-alpha:8080"
      S3_ENDPOINT: "minio-alpha:9000"
      S3_ACCESS_KEY: "briefly_admin"
      S3_SECRET_KEY: "briefly_storage_secret"
    depends_on:
      - redis-alpha

  # ────────────────────────────────────────────────────────────────────────────
  # Node Beta (Secondary Node - Simulates a Teammate's Laptop)
  # ────────────────────────────────────────────────────────────────────────────
  api-beta:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/m-amir-gomaa/briefly-api:latest
    container_name: api-beta
    environment:
      DATABASE_URL: "postgres://root@${PRIMARY_NODE_IP:-crdb-alpha}:26257/defaultdb?sslmode=disable"
      REDIS_URL: "redis://${PRIMARY_NODE_IP:-redis-alpha}:6379"
      S3_ENDPOINT: "${PRIMARY_NODE_IP:-minio-alpha}:9000"
      S3_ACCESS_KEY: briefly_admin
      S3_SECRET_KEY: briefly_storage_secret
      BRIEFLY_DEMO_GEMINI_API_KEY: "${BRIEFLY_DEMO_GEMINI_API_KEY}"
      PORT: "8081"
      WORKER_ID: "node-beta"
    ports:
      - "8081:8081"
    depends_on:
      crdb-alpha:
        condition: service_healthy
      redis-alpha:
        condition: service_healthy
      minio-alpha:
        condition: service_healthy
    restart: unless-stopped

  worker-beta:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    image: ghcr.io/m-amir-gomaa/briefly-worker:latest
    container_name: worker-beta
    environment:
      REDIS_URL: "redis://${PRIMARY_NODE_IP:-redis-alpha}:6379"
      WORKER_ID: "node-beta"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY}"
      API_URL: "http://${PRIMARY_NODE_IP:-api-alpha}:8080"
      S3_ENDPOINT: "${PRIMARY_NODE_IP:-minio-alpha}:9000"
      S3_ACCESS_KEY: "briefly_admin"
      S3_SECRET_KEY: "briefly_storage_secret"
    depends_on:
      redis-alpha:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ghcr.io/m-amir-gomaa/briefly-frontend:latest
    container_name: briefly-ui
    ports:
      - "80:80"
    depends_on:
      - api-alpha

  watchtower:
    image: containrrr/watchtower
    container_name: briefly-watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.docker/config.json:/config.json:ro
    command: --interval 60 --cleanup
    restart: always

volumes:
  crdb_alpha_data:
  minio_alpha_data:
