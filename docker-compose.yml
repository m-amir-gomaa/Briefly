version: "3.9"

services:
  # ─────────────────────────────────────────────
  # PostgreSQL — Persistence
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: briefly_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-briefly}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-briefly_secret}
      POSTGRES_DB: ${DB_NAME:-briefly_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U briefly"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Redis — Job Queue & Cache
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: briefly_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Go Backend API
  # ─────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: briefly_api
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://${DB_USER:-briefly}:${DB_PASSWORD:-briefly_secret}@postgres:5432/${DB_NAME:-briefly_db}?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      AI_SERVICE_URL: "http://ai_worker:8001"
      JWT_SECRET: "${JWT_SECRET:-briefly_jwt_secret_change_me}"
      # S3/MinIO Config
      S3_ENDPOINT: "minio:9000"
      S3_ACCESS_KEY: "${MINIO_USER:-briefly_admin}"
      S3_SECRET_KEY: "${MINIO_PASSWORD:-briefly_storage_secret}"
      S3_BUCKET: "briefly-media"
      PORT: "8080"
      ENV: "development"
      GOGC: "200" 
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - media_data:/uploads

  # ─────────────────────────────────────────────
  # MinIO — Self-hosted S3 (Local VM Storage)
  # ─────────────────────────────────────────────
  minio:
    image: minio/minio
    container_name: briefly_minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-briefly_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-briefly_storage_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # ─────────────────────────────────────────────
  # Python AI Worker
  # ─────────────────────────────────────────────
  ai_worker:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: briefly_ai_worker
    restart: unless-stopped
    environment:
      REDIS_URL: "redis://redis:6379"
      API_URL: "http://api:8080"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-dummy}"
      # S3/MinIO Config (AI needs to read images)
      S3_ENDPOINT: "minio:9000"
      S3_ACCESS_KEY: "${MINIO_USER:-briefly_admin}"
      S3_SECRET_KEY: "${MINIO_PASSWORD:-briefly_storage_secret}"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - media_data:/uploads

  # ─────────────────────────────────────────────
  # React Frontend
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: briefly_frontend
    restart: unless-stopped
    depends_on:
      - api

  # ─────────────────────────────────────────────
  # Nginx Reverse Proxy (mirrors production)
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: briefly_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  media_data:
  minio_data:
