version: "3.9"

services:
  # ─────────────────────────────────────────────
  # PostgreSQL — Persistence
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: briefly_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U briefly"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Redis — Job Queue & Cache
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: briefly_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Go Backend API
  # ─────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: briefly_api
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      AI_SERVICE_URL: "http://ai_worker:8001"
      JWT_SECRET: "${JWT_SECRET}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
      INTERNAL_SERVICE_KEY: "${INTERNAL_SERVICE_KEY:-briefly_internal_secret_key}"
      # S3/MinIO Config
      S3_ENDPOINT: "minio:9000"
      S3_ACCESS_KEY: "${MINIO_USER}"
      S3_SECRET_KEY: "${MINIO_PASSWORD}"
      S3_BUCKET: "briefly-media"
      PORT: "8080"
      ENV: "development"
      GOGC: "200" 
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - media_data:/uploads

  # ─────────────────────────────────────────────
  # MinIO — Self-hosted S3 (Local VM Storage)
  # ─────────────────────────────────────────────
  minio:
    image: minio/minio
    container_name: briefly_minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # ─────────────────────────────────────────────
  # Python AI Worker
  # ─────────────────────────────────────────────
  ai_worker:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: briefly_ai_worker
    restart: unless-stopped
    environment:
      REDIS_URL: "redis://redis:6379"
      API_URL: "http://api:8080"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY}"
      INTERNAL_SERVICE_KEY: "${INTERNAL_SERVICE_KEY:-briefly_internal_secret_key}"
      # S3/MinIO Config (AI needs to read images)
      S3_ENDPOINT: "minio:9000"
      S3_ACCESS_KEY: "${MINIO_USER}"
      S3_SECRET_KEY: "${MINIO_PASSWORD}"
      AI_PROVIDER: "${AI_PROVIDER:-gemini}"
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_MODEL: "tinyllama"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - media_data:/uploads

  # ─────────────────────────────────────────────
  # React Frontend
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: briefly_frontend
    restart: unless-stopped
    depends_on:
      - api

  # ─────────────────────────────────────────────
  # Caddy Reverse Proxy (demo gateway)
  # ─────────────────────────────────────────────
  caddy:
    image: caddy:alpine
    container_name: briefly_caddy
    restart: unless-stopped
    environment:
      API_UPSTREAM: "http://api:8080"
      FRONTEND_UPSTREAM: "http://frontend:80"
    ports:
      - "80:80"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - frontend

  # ─────────────────────────────────────────────
  # Auto-Deployment (Watchtower)
  # ─────────────────────────────────────────────
  watchtower:
    image: containrrr/watchtower
    container_name: briefly_watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --cleanup
    environment:
      - WATCHTOWER_CLEANUP=true

  # ─────────────────────────────────────────────
  # Monitoring (Prometheus & Grafana)
  # ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: briefly_prometheus
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana-oss:latest
    container_name: briefly_grafana
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
    depends_on:
      - prometheus

  # ─────────────────────────────────────────────
  # Ollama — Local LLM Inference
  # ─────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: briefly_ollama
    restart: unless-stopped
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  redis_data:
  media_data:
  minio_data:
  prometheus_data:
  grafana_data:
  ollama_data:
