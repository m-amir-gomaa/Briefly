version: "3.9"

services:
  # ─────────────────────────────────────────────
  # PostgreSQL — Persistence
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: briefly_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: briefly
      POSTGRES_PASSWORD: briefly_secret
      POSTGRES_DB: briefly_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U briefly"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Redis — Job Queue & Cache
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: briefly_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Go Backend API
  # ─────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: briefly_api
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://briefly:briefly_secret@postgres:5432/briefly_db?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      AI_SERVICE_URL: "http://ai_worker:8001"
      PORT: "8080"
      ENV: "development"
      GOGC: "200" # Trade RAM for lower CPU latency (as per Deep Analysis)
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─────────────────────────────────────────────
  # Python AI Worker
  # ─────────────────────────────────────────────
  ai_worker:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: briefly_ai_worker
    restart: unless-stopped
    environment:
      REDIS_URL: "redis://redis:6379"
      API_URL: "http://api:8080"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-dummy}"
    depends_on:
      redis:
        condition: service_healthy

  # ─────────────────────────────────────────────
  # Nginx Reverse Proxy (mirrors production)
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: briefly_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
