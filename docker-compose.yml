version: "3.9"

services:
  # ── PostgreSQL 16 ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: briefly_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: briefly
      POSTGRES_PASSWORD: briefly_secret
      POSTGRES_DB: briefly_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U briefly -d briefly_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis 7 ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: briefly_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Go Backend API ─────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: briefly_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://briefly:briefly_secret@postgres:5432/briefly_db?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      AI_SERVICE_URL: http://ai_worker:8001
      PORT: "8080"
      GOGC: "200"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Python AI Worker ───────────────────────────────────────────
  ai_worker:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: briefly_ai_worker
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      API_URL: http://api:8080
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-your_gemini_api_key_here}
    depends_on:
      redis:
        condition: service_healthy

  # ── Nginx Reverse Proxy ────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: briefly_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  pgdata:
