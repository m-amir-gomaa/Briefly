worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80 default_server;
        server_name _;

        # ── Docker Dynamic DNS Resolution ────────────────────────────
        # Forces Nginx to re-query IPs so updates don't cause 502 errors
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_backend "http://api-alpha:8080";
        set $frontend_backend "http://frontend:80";

        client_max_body_size 25M;

        # ── SSE endpoint (buffering disabled) ────────────────────
        location /api/v1/events/ {
            proxy_pass         $api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   Connection "";

            # Disable buffering for SSE
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;

            # Disable gzip for SSE
            proxy_set_header   Accept-Encoding "";
        }

        # ── API routes ───────────────────────────────────────────
        location /api/ {
            proxy_pass         $api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout 120s;
            proxy_read_timeout    120s;
            proxy_send_timeout    120s;
        }

        # ── Frontend ───────────────────────────────────────────
        location / {
            proxy_pass         $frontend_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
