name: Briefly Pentagram CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Run Go Tests
        run: |
          cd backend
          rm -f go.sum
          go mod tidy
          go test -v ./...

  python-lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd ai_service
          pip install -r requirements.txt
          pip install ruff
      - name: Lint with Ruff
        run: |
          cd ai_service
          ruff check .

  build-and-push:
    needs: [backend-tests]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/m-amir-gomaa/briefly-api:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push AI Worker
        uses: docker/build-push-action@v5
        with:
          context: ./ai_service
          push: true
          tags: ghcr.io/m-amir-gomaa/briefly-worker:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/m-amir-gomaa/briefly-frontend:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
